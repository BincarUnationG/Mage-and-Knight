# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# 配置缓存必须关闭：Fabric 的 devlaunch injector 在初始化脚本里用 Gradle.addListener，
# 这是 Gradle 配置缓存明确不支持的东西，开启后 runClient / runServer 会直接失败：
#   "registration of listener on 'Gradle.addListener' is unsupported"
# 想要更快构建时可以临时加 --configuration-cache，但别用它跑游戏。
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.20.1
# Loom 1.18+ 的构建 JVM 要求 Java 25，本机只有 21，故锁到 1.17 系列（最新 1.17.21 支持 Java 21）
# 构建用的 JVM 版本由 gradle/gradle-daemon-jvm.properties 强制指定为 21
# 若以后升级到 Java 25+，可改回 1.19.3，并同步改那个文件
loom_version=1.17.21

# Mod Properties
version=1.0.0
group=com.bincarunationg.mageknight

# Dependencies
fabric_api_version=0.92.12+1.20.1
