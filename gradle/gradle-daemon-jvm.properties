# Gradle Daemon JVM 条件文件
#
# 作用：不管命令行还是 IDEA 用哪个 JVM 启动 Gradle，都强制让「构建」跑在 Java 21 上。
# 原因：Fabric Loom 1.17 的元数据要求 JVM >= 21（见 https://maven.fabricmc.net/net/fabricmc/fabric-loom/1.17.21/），
#       用 JDK 17 启动会直接报：
#       "Dependency requires at least JVM runtime version 21. This build uses a Java 17 JVM."
#
# Gradle 会先从本机已安装的 JDK 里找 21（例如 C:\Program Files\Java\jdk-21）。
# 如果本机没有 JDK 21，需要在 settings.gradle 里配置 toolchain 下载源，或手动安装 JDK 21。
toolchainVersion=21
